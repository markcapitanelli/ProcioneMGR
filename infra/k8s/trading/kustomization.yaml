# Fase 3 — GitOps. Il tag pinnato qui vince sul `:latest` placeholder di deployment.yaml: è questo
# file, in Git, a dire quale build gira sul cluster. Bump manuale (= la promozione resta una scelta
# umana). Vedi ui/kustomization.yaml per il ragionamento completo.
#
# Qui il tag pinnato conta più che altrove: è il servizio che esegue ordini veri. Sapere con
# certezza, da Git, quale binario sta operando sul mercato — e poter tornare indietro con un revert —
# è esattamente il tipo di garanzia che `:latest` non può dare.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: procionemgr-trading

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# [B3] Assetto del core (feed R1 in osservazione, carry Paper): generato con hash nel nome, come
# ui-config — cambiare il file sostituisce il pod e le env vengono rilette davvero.
configMapGenerator:
  - name: trading-config
    envs:
      - trading-config.env

images:
  # ┌─────────────────────────────────────────────────────────────────────────────────────────┐
  # │ [2026-08-07] ATTENZIONE — il cluster NON sta girando questo digest. Vedi sotto.          │
  # └─────────────────────────────────────────────────────────────────────────────────────────┘
  #
  # Il motore girava con le uscite protettive CIECHE: consumava la candela ancora in FORMAZIONE
  # (l'ingestione REST scrive anche l'ultima kline incompleta) e valutava stop e target su
  # High/Low parziali; la barra definitiva veniva poi scartata dalla guardia anti-replay. Le
  # protezioni scattavano solo ai riavvii, che rifanno il replay sulle barre ormai chiuse — e i
  # riavvii arrivavano dalla sonda a un secondo, corretta in deployment.yaml.
  # Correzione: TradingWorker.LastClosedBarOpenUtc, PR #70.
  #
  # Il 2026-08-06 GitHub Actions era in guasto maggiore (incidente qcvjkzcs7j74) e nessuna
  # immagine poteva essere costruita. Su richiesta del proprietario il motore e stato aggiornato
  # con un build LOCALE del commit c026a67 (`procionemgr-trading:local-c026a67`), caricato in
  # containerd e applicato al cluster in modo IMPERATIVO.
  #
  # Quel ponte vive SOLO nel cluster, di proposito: qui resta il digest ufficiale, perche un pin
  # a un'immagine che esiste su una sola macchina non deve entrare in master.
  #
  # >>> CONSEGUENZA DA NON DIMENTICARE: finche il digest qui sotto non viene aggiornato, un
  # >>> `kubectl apply -k` RIPORTA IL MOTORE ALLA VERSIONE COL DIFETTO. Prima di riapplicare,
  # >>> sostituire il digest con quello del build di master che contiene il PR #70.
  #
  - name: ghcr.io/markcapitanelli/procionemgr-trading
    # [E5/E6, 2026-07-31 — Filone E] Il motore impara a dire di no: battito di valutazione
    # (LastProcessedCandleUtc + Timeframe nello status, campi proto 22/23), allarme di INEDIA nel
    # LaneInvariantWatchdog (running senza candele = stop e trailing che nessuno valuta; una
    # notifica per transizione, col discriminatore stantio-E-fermo che non scambia il replay di
    # avvio per un digiuno), rpc GetNotificationChannelStatus (la spia del canale si legge senza
    # inviare nulla), e il dual-read ML finalmente collegabile (E3: binding+client mancavano in
    # questo host, "Ml" ora nell'allow-list di configurazione).
    #
    # PINNATO SUL DIGEST, non sul tag. Un tag e' un'etichetta mobile: puo' essere spostato su
    # un'altra immagine, o rimosso. Il digest E' l'immagine — e' l'hash del suo manifest, quindi
    # dice senza ambiguita' quale binario sta operando sul mercato, ed e' verificabile dal registro.
    # Il tag del commit resta scritto qui accanto perche' un umano possa risalire al sorgente.
    #
    # Provenienza: costruita da .github/workflows/docker-build.yml sul commit
    # 355b6850d67f3c1bd6caf3d25dad9a55f2bde89f di master, DOPO la guardia che rifiuta immagini
    # contenenti un appsettings.json reale.
    #
    # Assetti precedenti: 300ca20d (01c74eea, Get/SetEngineConfig + canale notifiche del motore),
    # 562b359 (sentinella d'ombra, tick osservati). INVARIATO l'assetto operativo: uscite guidate
    # dalle candele (DriveProtectiveExits=false per MISURA, docs/REPORT-B3-EXITLAG-2026-07-28.md),
    # feed R1 in osservazione, carry Paper.
    digest: sha256:df9899c302e14b4625ad68a13256a5e2cdf57c723a630c412c22400779c8b747
