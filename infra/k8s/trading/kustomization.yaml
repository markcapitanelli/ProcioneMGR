# Fase 3 — GitOps. Il tag pinnato qui vince sul `:latest` placeholder di deployment.yaml: è questo
# file, in Git, a dire quale build gira sul cluster. Bump manuale (= la promozione resta una scelta
# umana). Vedi ui/kustomization.yaml per il ragionamento completo.
#
# Qui il tag pinnato conta più che altrove: è il servizio che esegue ordini veri. Sapere con
# certezza, da Git, quale binario sta operando sul mercato — e poter tornare indietro con un revert —
# è esattamente il tipo di garanzia che `:latest` non può dare.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: procionemgr-trading

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# [B3] Assetto del core (feed R1 in osservazione, carry Paper): generato con hash nel nome, come
# ui-config — cambiare il file sostituisce il pod e le env vengono rilette davvero.
configMapGenerator:
  - name: trading-config
    envs:
      - trading-config.env

images:
  # [Fase 4, 2026-08-10] RISOLTA la divergenza del 2026-08-07: il cluster girava col ponte
  # imperativo `local-c026a67` (build locale d'emergenza durante il guasto maggiore di GitHub
  # Actions del 2026-08-06) mentre qui restava pinnato il digest CI pre-PR#70 — e un apply -k
  # avrebbe RIPORTATO il motore alla versione con le uscite protettive cieche (candela in
  # formazione; fix TradingWorker.LastClosedBarOpenUtc, PR #70).
  #
  # Da oggi la via d'emergenza e' la via ordinaria, formalizzata: le immagini si costruiscono in
  # locale (scripts/build-images-local.ps1), si importano nel containerd del nodo e si pinnano
  # qui col tag local-<sha> — l'equivalente locale del digest (un build locale non ha un digest
  # di registro verificabile; il tag dice da quale commit vengono i bit, e chi vuole risalire al
  # sorgente ha lo sha). Il bump resta manuale: il bump E' la promozione.
  #
  # Storia dei pin CI precedenti (per il rollback via CI, se mai): digest
  # sha256:df9899c302e14b4625ad68a13256a5e2cdf57c723a630c412c22400779c8b747 (commit 355b6850,
  # E5/E6 Filone E), prima ancora 300ca20d e 562b359. Assetto operativo INVARIATO attraverso
  # tutti i bump: uscite guidate dalle candele (DriveProtectiveExits=false per MISURA, report
  # B3), feed R1 in osservazione, carry Paper.
  - name: ghcr.io/markcapitanelli/procionemgr-trading
    # [E5/E6, 2026-07-31 — Filone E] Il motore impara a dire di no: battito di valutazione
    # (LastProcessedCandleUtc + Timeframe nello status, campi proto 22/23), allarme di INEDIA nel
    # LaneInvariantWatchdog (running senza candele = stop e trailing che nessuno valuta; una
    # notifica per transizione, col discriminatore stantio-E-fermo che non scambia il replay di
    # avvio per un digiuno), rpc GetNotificationChannelStatus (la spia del canale si legge senza
    # inviare nulla), e il dual-read ML finalmente collegabile (E3: binding+client mancavano in
    # questo host, "Ml" ora nell'allow-list di configurazione).
    #
    # [2026-08-13] Promozione: il feed real-time smette di notificare le intermittenze non
    # azionabili (caso STX/USDT illiquido, che inondava Telegram e saturava il rate-limit
    # condiviso con gli allarmi veri) — persistenza, azionabilità e cooldown sulla notifica,
    # log invariato. Vedi docs/REPORT-FEED-STALENESS-STX-2026-08-13.md.
    #
    # [2026-08-17] Promozione: revisione completa della sezione Trading (PR #93). Nel MOTORE
    # entrano quattro correzioni che nessun pannello poteva mostrare:
    #  · la fee d'INGRESSO Futures non viene più sottratta due volte alla chiusura — l'errore era
    #    cumulativo e contaminava la curva equity, quindi Sharpe e MaxDrawdown, quindi le
    #    decisioni di promozione;
    #  · «flat sull'exchange» e «non sono riuscito a leggere» sono ora due fatti distinti
    #    (FuturesPositionRead): prima un 429 chiudeva la posizione LOCALMENTE senza reduce-only,
    #    abbandonando esposizione reale;
    #  · il feed non rigioca più il passato dopo un riavvio (segnalibro di sessione persistito
    #    LastCandleUtc, campo proto 24 + colonna additiva) e alimenta la serie della SESSIONE, non
    #    quella della configurazione viva che l'auto-apply può riscrivere sotto una corsia attiva;
    #  · filtri del simbolo degeneri (StepSize 0) trattati come assenti invece di degradare
    #    l'arrotondamento a no-op silenzioso (R15).
    # PREREQUISITO DI QUESTO BUMP, già assolto: la migrazione additiva
    # 20260817100224_AddTradingEngineStateLastCandleUtc dev'essere applicata PRIMA, o il motore
    # nuovo interroga una colonna che non esiste.
    # Il primo bump di oggi (local-dcea49b1) ha fatto emergere dal vivo un effetto collaterale
    # della correzione stessa: senza replay dopo un riavvio, fra il riavvio e la chiusura della
    # barra successiva nessuna candela risulta valutata, e il LaneInvariantWatchdog gridava
    # «AFFAMATA» su tutte e sette le corsie. Corretto (battito che ricade sul segnalibro + grazia
    # post-avvio pari a una barra piena più la tolleranza) e ripromosso.
    # Precedente: local-0e97f5ea, poi local-dcea49b1.
    #
    # [2026-08-21] Promozione — e prima di tutto la ragione per cui era urgente: il pin qui sopra
    # (local-9a3e8dbe, commit del 17 agosto) è rimasto fermo QUATTRO GIORNI mentre master
    # avanzava, e nessuno se n'era accorto. Il guscio si aggiorna con l'app, il core si promuove a
    # mano: finora quel prezzo non lo pagava nessuno perché nessuno lo guardava. Conseguenze
    # misurate, non ipotizzate:
    #  · la correzione dello SPECCHIO DELLA POSIZIONE (2026-08-20) non stava girando —
    #    GridMeanReversion apriva e non prendeva mai il proprio profitto perché lo specchio
    #    ripartiva «flat» a ogni barra. Le corsie 4 e 5 erano state lasciate intatte apposta come
    #    «unico test pulito della correzione»: eseguivano la versione rotta, e quell'esperimento
    #    non era mai partito;
    #  · l'immagine non conosceva nemmeno RunningStrategyIds (I13a, campo proto 25), quindi il
    #    confronto configurato-vs-eseguito di /ensemble non poteva funzionare per costruzione.
    #
    # QUESTO bump porta nel motore il difetto D1 corretto, che è la ragione per cui la flotta era
    # viva e muta: `_active`, `_creds` e `_filters` li valorizzava SOLO StartAsync, e
    # EnsureLoadedAsync — la strada di ogni riavvio del processo — non li restaurava. La corsia
    # ripartiva con IsRunning = true, riceveva candele, marcava a mercato e onorava gli stop di ciò
    # che era già aperto, e il `foreach (var strat in _active)` girava a vuoto: nessuna apertura,
    # per sempre, in silenzio. Misurato il 2026-08-21: cinque corsie «in esecuzione», feed
    # all'ultima candela, UN SOLO ordine in tutta la flotta in sette giorni, mentre sulla sola
    # corsia 1 l'RSI a 14 era sceso sotto soglia 57 volte. Con ~8 restart del pod al giorno, il
    # percorso freddo era la norma, non l'eccezione.
    # Entra anche il presidio D2: una chiusura Testnet/Live senza credenziali non si finalizza più
    # SOLO LOCALMENTE (prima rimuoveva la posizione e scriveva il TradeRecord senza aver chiuso
    # nulla sull'exchange — fail-OPEN sull'unica strada che non può esserlo, regola 4).
    #
    # PREREQUISITO DI QUESTO BUMP, già assolto: la migrazione additiva
    # 20260821034147_SessionActiveStrategies dev'essere applicata PRIMA (colonna
    # TradingEngineStates.ActiveStrategiesJson), o il motore nuovo interroga una colonna che non
    # esiste. Applicata il 2026-08-21 con `dotnet-ef database update`.
    #
    # DOPO IL ROLLOUT serve un passo che il deploy non fa da solo: ogni corsia va FERMATA E
    # RIAVVIATA da /trading. Il ripiego dichiarato copre l'intervallo, ma solo uno StartAsync
    # lascia sulla riga la fotografia delle gambe di questa sessione.
    # Vedi docs/audit/33_FLOTTA_INERTE_2026-08-21.md.
    newTag: local-94aa42eb
