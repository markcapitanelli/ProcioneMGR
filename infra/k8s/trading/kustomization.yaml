# Fase 3 — GitOps. Il tag pinnato qui vince sul `:latest` placeholder di deployment.yaml: è questo
# file, in Git, a dire quale build gira sul cluster. Bump manuale (= la promozione resta una scelta
# umana). Vedi ui/kustomization.yaml per il ragionamento completo.
#
# Qui il tag pinnato conta più che altrove: è il servizio che esegue ordini veri. Sapere con
# certezza, da Git, quale binario sta operando sul mercato — e poter tornare indietro con un revert —
# è esattamente il tipo di garanzia che `:latest` non può dare.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: procionemgr-trading

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml

# [B3] Assetto del core (feed R1 in osservazione, carry Paper): generato con hash nel nome, come
# ui-config — cambiare il file sostituisce il pod e le env vengono rilette davvero.
configMapGenerator:
  - name: trading-config
    envs:
      - trading-config.env

images:
  - name: ghcr.io/markcapitanelli/procionemgr-trading
    # [2026-07-29] Configurazione del motore leggibile e scrivibile dal guscio via gRPC
    # (GetEngineConfig/SetEngineConfig). Serviva perche' il file condiviso su PVC — l'unico canale
    # previsto finora — resta vuoto quando il guscio NON gira nel cluster, e i pannelli mostravano
    # cosi' la configurazione del guscio invece di quella applicata dal motore. Con questa build
    # l'assetto operativo del core esce dalla ConfigMap e passa al file, che ora la UI sa scrivere.
    #
    # PINNATO SUL DIGEST, non sul tag. Un tag e' un'etichetta mobile: puo' essere spostato su
    # un'altra immagine, o rimosso. Il digest E' l'immagine — e' l'hash del suo manifest, quindi
    # dice senza ambiguita' quale binario sta operando sul mercato, ed e' verificabile dal registro.
    # Il tag del commit resta scritto qui accanto perche' un umano possa risalire al sorgente.
    #
    # Provenienza: costruita da .github/workflows/docker-build.yml sul commit
    # 01c74eea91377892c4e24f84b36abd683bed03df di master, DOPO la guardia che rifiuta immagini
    # contenenti un appsettings.json reale. Le build locali usate durante l'audit
    # (audit-20260729, ...b, ...c) erano tappe di verifica sul cluster di sviluppo e non vanno
    # ripinnate: non esistono nel registro e un cluster ricreato non le troverebbe.
    #
    # [B3, 2026-07-28] Assetto precedente (562b359db3733aec8f222d76fad59c18ff7aefdd): sentinella
    # d'ombra, tick osservati invece che scartati. INVARIATO — le uscite restano guidate dalle
    # candele (DriveProtectiveExits=false per MISURA, vedi docs/REPORT-B3-EXITLAG-2026-07-28.md).
    digest: sha256:300ca20d4ea52cc3d8ed3b08321c64e8bd3e1b578249aef5089a677a858d1d6a
