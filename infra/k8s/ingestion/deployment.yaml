# Deployment del microservizio di ingestione OHLCV (Fase 1).
# replicas: 1 SEMPRE — vincolo non negoziabile: il cursore di sync (MaxAsync non lockato) e
# l'upsert SELECT-poi-INSERT non atomico non tollerano due scrittori concorrenti sulla stessa
# serie. Vedi infra/k8s/README.md.
# ⚠ DOPPIO SCRITTORE: questo pod esegue il worker di sync schedulato. Va deployato SOLO con il
# monolite in modalità remota (MarketData:UseRemoteIngestion=true → worker locale spento) oppure
# con MarketData:Enabled=false nel monolite. Mai due worker sullo stesso DB.
# Prerequisito: Secret postgres-conn nel namespace (scripts/k8s-postgres-secret.ps1).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: procionemgr-ingestion
  namespace: procionemgr-ingestion
  labels:
    app.kubernetes.io/part-of: procionemgr
    app.kubernetes.io/component: ingestion
spec:
  replicas: 1
  strategy:
    # Recreate, non RollingUpdate: mai due istanze del worker di sync vive insieme,
    # nemmeno per la durata di un rollout.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: procionemgr
        app.kubernetes.io/component: ingestion
    spec:
      containers:
        - name: ingestion
          image: ghcr.io/markcapitanelli/procionemgr-ingestion:latest
          # [Fase 4] Immagine da build locale (scripts/build-images-local.ps1), mai pull dal registry.
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: postgres-conn   # fornisce ConnectionStrings__PostgresConnection
          # [2026-08-13] timeoutSeconds ESPLICITO — la stessa lezione del deployment trading
          # (2026-08-06), che qui non era stata portata: senza, Kubernetes usa 1 SECONDO, e con
          # failureThreshold 3 il pod viene ucciso con SIGKILL se /health è lento tre volte.
          #
          # Non è teoria nemmeno qui: 8 riavvii in 3 giorni, tutti `Liveness probe failed:
          # context deadline exceeded`, SEMPRE a metà recupero candele — e ogni kill allungava
          # l'arretrato del giro successivo (si vedeva «OK: 337 candele»), fino a 89 serie oltre
          # tolleranza il 2026-08-13. Su un nodo affollato (cpu limit 1, WSL stretta) un endpoint
          # di salute può superare il secondo per puro scheduling.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
